<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Search & Button Page</title>
    
</head>
<body>

    <div class="container">
        <h2>Search & Action Example</h2>
        
        <!-- Search Form Area -->
        <div class="form-group">
            <input type="text" placeholder="Type to search...">
            <button class="btn-search">Search</button>
        </div>

        <!-- Regular Button Area -->
        <div class="form-group">
            <button class="btn-action" onclick="alert('Button Clicked!')">Click Me</button>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
